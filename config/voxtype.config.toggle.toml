# ~/.config/voxtype/config.toml — TOGGLE-MODE variant (HOTKEY_MODE=toggle ./install.sh)
# Installed by install.sh. Field names verified against voxtype.io/docs/CONFIGURATION (Sept 2026).
# If `voxtype configure` or the daemon log complains about an unknown key, check that page.

engine = "parakeet"
state_file = "auto"        # $XDG_RUNTIME_DIR/voxtype/state: idle | recording | streaming | transcribing.
                           # Required by `voxtype record toggle`; read by dictate-indicator (the edge glow).

[audio]
max_duration_secs = 60     # hard cap: the daemon stops and transcribes on its own after this. The last
                           # 10 s are shown as an amber pulse by dictate-indicator. Raise for long dictation.

[hotkey]
key = "F13"                # ignored: enabled = false below
modifiers = []
mode = "toggle"
enabled = false            # no evdev listener → no `input` group needed. Hotkey is a COSMIC custom shortcut running: voxtype record toggle
cancel_key = "ESC"

[parakeet]
model = "parakeet-tdt-0.6b-v3"   # ~/.local/share/voxtype/models/parakeet-tdt-0.6b-v3/
on_demand_loading = false        # keep resident: latency > VRAM on a 12 GB card
# streaming = true would force toggle mode and defeat release-to-paste. Leave it off.

[output]
mode = "paste"                            # clipboard + keystroke; NOT "type" (ydotool would type keycodes)
paste_keys = "shift+insert"               # works in GTK, Qt, Firefox, Electron/VS Code AND terminals
restore_clipboard = true
restore_clipboard_delay_ms = 300
type_delay_ms = 60                        # ms between key events of the paste chord (ydotool -d). At ydotool's 12 ms default,
                                          # Electron apps (Claude, VS Code, Slack…) receive the key without its modifier.
fallback_to_clipboard = true
driver_order = ["ydotool", "clipboard"]   # never wtype/eitype on COSMIC (types digits instead of text)

[output.post_process]
command = "/home/pitipatw/.local/bin/polish.py"   # symlink -> ~/dev/localSTT/polish.py
timeout_ms = 6000                                 # polish.py itself gives up on Ollama after 4 s

[osd]
enabled = false                           # overlays can steal focus on COSMIC so the paste lands in the wrong window
