# managed by localSTT v1 — install.sh fills in your user name and writes this to /etc/tmpfiles.d/hotkeyd.conf
#
# /run/hotkeyd holds exactly one socket. Owner hotkeyd (the daemon binds it), group @USER@ (you
# connect to it), setgid so the socket inherits that group and comes out 0660 hotkeyd:@USER@.
#
# Why not RuntimeDirectory= plus an ExecStartPre chgrp/chmod: systemd rebuilds the runtime
# directory's ownership and RuntimeDirectoryMode for EVERY Exec* invocation, so the ExecStartPre
# is undone before ExecStart runs. The directory ends up 0750 hotkeyd:hotkeyd, the socket cannot
# inherit your group, and you cannot even traverse the directory to reach it.
d /run/hotkeyd 2750 hotkeyd @USER@ -
